schema: paperclip/v1
schemaVersion: 7
company:
  requireBoardApprovalForNewAgents: true
agents:
  ceo:
    adapter:
      type: claude_local
    budgetMonthlyCents: 1000
  cto:
    adapter:
      type: claude_local
    budgetMonthlyCents: 1500
  engineer:
    adapter:
      type: claude_local
    budgetMonthlyCents: 2500
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
  qa:
    adapter:
      type: claude_local
    budgetMonthlyCents: 1000
projects:
  swapdo-web:
    workspaces:
      swapdo:
        name: swapdo
        sourceType: git_repo
        repoUrl: https://github.com/udhayapragu/swapdo
        repoRef: main
        defaultRef: main
        setupCommand: npm ci
        isPrimary: true
routines:
  weekly-health-check:
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1"
        timezone: Asia/Kolkata
